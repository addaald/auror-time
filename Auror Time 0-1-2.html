<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Auror Time — Focus</title>
  <style>
:root{color-scheme:dark;--bg:#211d32;--bg-deep:#1c192b;--surface:#28243a;--surface-hi:#302b43;--text:#f1eef4;--muted:#9a94aa;--muted-2:#746e84;--line:#3a354c;--gold:#f3c75a;--gold-bright:#ffdc77;--ring-track:#41394d;--green:#91b79a}
*{box-sizing:border-box}
html{min-width:320px;min-height:100%;background:var(--bg-deep)}
body{min-height:100vh;margin:0;display:flex;justify-content:center;align-items:flex-start;background:radial-gradient(ellipse at 50% 18%,#38304e 0%,var(--bg) 48%,var(--bg-deep) 100%);color:var(--text);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{color:inherit}
.app-shell{width:min(100%,500px);min-height:100vh;padding:30px 36px 19px;display:flex;flex-direction:column}
.topbar{min-height:42px;display:flex;align-items:center;justify-content:space-between}
.header-tools{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.language-switch{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#242035}
.language-button{min-width:29px;height:25px;padding:0 5px;border:0;border-radius:4px;background:transparent;color:var(--muted-2);font-family:"DM Mono",monospace;font-size:9px;cursor:pointer;transition:color .15s,background .15s}
.language-button:hover{color:var(--text)}
.language-button.active{background:#39334b;color:var(--gold)}
.language-button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-size:17px;font-weight:700;letter-spacing:-.04em;text-decoration:none}
.date-label{color:var(--muted);font-size:10px;letter-spacing:.04em}
.tabs{display:flex;align-items:center;gap:29px;margin-top:19px;border-bottom:1px solid var(--line)}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:0 1px 13px;border:0;background:none;color:var(--muted-2);font-size:12px;font-weight:600;cursor:pointer;transition:color .18s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--gold)}
.tab.active::after{position:absolute;right:0;bottom:-1px;left:0;height:2px;background:var(--gold);content:""}
.tab-count{min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;border-radius:10px;background:#39334b;color:#c6bfd0;font-family:"DM Mono",monospace;font-size:9px}
.view{flex:1;display:flex;flex-direction:column;align-items:center}
.task-input-wrap{width:min(100%,310px);margin-top:27px;display:flex;flex-direction:column;gap:8px}
.task-input-wrap label,.view-eyebrow{margin:0;color:var(--muted-2);font-size:9px;font-weight:700;letter-spacing:.16em}
.task-input-wrap input{width:100%;height:38px;padding:0 11px;border:1px solid #39344b;border-radius:7px;outline:none;background:#242035;color:var(--text);font-size:12px;transition:border-color .18s,background .18s}
.task-input-wrap input::placeholder{color:#817a91}
.task-input-wrap input:focus{border-color:#8c7443;background:#272238}
.task-input-wrap input:disabled{opacity:.7}
.timer-stage{position:relative;width:min(100%,320px);aspect-ratio:1;margin:20px auto 6px;display:grid;place-items:center}
.timer-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible;transform:rotate(-90deg)}
.ring-track,.ring-progress,.ring-inner{fill:none}
.ring-track{stroke:var(--ring-track);stroke-width:1.5}
.ring-progress{stroke:var(--gold);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:929.91;stroke-dashoffset:0;filter:drop-shadow(0 0 5px #f3c75a70);transition:stroke-dashoffset .45s linear,stroke .2s}
.ring-inner{stroke:#332d43;stroke-width:.8}
.timer-stage.is-running .ring-progress{stroke:var(--gold-bright);filter:drop-shadow(0 0 8px #f3c75a8c)}
.timer-stage.is-complete .ring-progress{stroke:var(--green);filter:drop-shadow(0 0 7px #91b79a55)}
.timer-content{z-index:1;display:flex;flex-direction:column;align-items:center;max-width:78%;margin-top:-1px;text-align:center}
.time-display{color:var(--gold);font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:clamp(43px,12vw,58px);font-weight:400;letter-spacing:-.075em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 23px #f3c75a14}
.task-caption{max-width:220px;min-height:22px;margin:16px 0 0;overflow:hidden;color:#c1bacb;font-size:14px;font-style:italic;text-overflow:ellipsis;white-space:nowrap}
.duration-control{width:min(100%,310px);margin-top:12px}
.control-label{margin-bottom:9px;color:var(--muted-2);font-size:10px}
.duration-options{display:flex;align-items:center;gap:7px}
.duration-chip{min-width:49px;height:31px;padding:0 11px;border:1px solid #403a50;border-radius:6px;background:transparent;color:#b4adbf;font-family:"DM Mono",monospace;font-size:11px;cursor:pointer;transition:.15s ease}
.duration-chip:hover{border-color:#81704d;color:var(--gold-bright)}
.duration-chip.selected{border-color:#9a804b;background:#3a3340;color:var(--gold)}
.duration-chip:disabled,.custom-duration input:disabled{opacity:.45;cursor:not-allowed}
.custom-duration{display:flex;align-items:center;gap:5px;margin-left:auto;color:var(--muted-2);font-size:9px}
.custom-duration input{width:48px;height:31px;padding:0 7px;border:1px solid #403a50;border-radius:6px;outline:none;background:transparent;color:var(--text);font-family:"DM Mono",monospace;font-size:11px;text-align:center}
.custom-duration input:focus{border-color:#9a804b}
.custom-duration input::placeholder{color:#70697e}
.action-row{width:min(100%,310px);display:grid;grid-template-columns:1fr 42px;gap:9px;margin-top:21px}
.start-button,.reset-button{height:43px;border-radius:7px;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.start-button{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--gold);background:var(--gold);color:#242032;font-size:12px;font-weight:700}
.start-button:hover{transform:translateY(-1px);background:var(--gold-bright)}
.start-button:active,.reset-button:active{transform:translateY(0)}
.button-icon{font-size:9px}
.reset-button{border:1px solid #4a435a;background:#28243a;color:#c1bacb;font-size:19px;line-height:1}
.reset-button:hover{border-color:#776a51;color:var(--gold)}
.timer-status{display:flex;align-items:center;gap:7px;margin-top:13px;color:var(--muted-2);font-size:10px}
.status-dot{width:6px;height:6px;border-radius:50%;background:#756f80}
.status-dot.running{background:var(--gold);box-shadow:0 0 0 3px #f3c75a20}
.status-dot.complete{background:var(--green);box-shadow:0 0 0 3px #91b79a1c}
.app-footer{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:auto;padding-top:20px;color:#777184;font-size:9px;letter-spacing:.025em}
.footer-divider{color:#5a5368}
.sessions-view{align-items:stretch;padding-top:31px}
.sessions-heading-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.sessions-heading-row h1{margin:5px 0 0;color:var(--text);font-size:24px;font-weight:500;letter-spacing:-.05em}
.today-total{color:var(--gold);font-family:"DM Mono",monospace;font-size:10px}
.session-list{display:flex;flex-direction:column;gap:9px}
.session-card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 14px;border:1px solid #39344b;border-radius:8px;background:#262237}
.session-main{min-width:0}
.session-name{overflow:hidden;color:var(--text);font-size:12px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}
.session-meta{margin-top:5px;color:var(--muted-2);font-size:9px}
.session-duration{flex:none;color:var(--gold);font-family:"DM Mono",monospace;font-size:11px}
.empty-state{padding:36px 16px;border:1px dashed #494258;border-radius:8px;color:var(--muted);font-size:11px;line-height:1.7;text-align:center}
.privacy-note{margin:14px 0 0;color:var(--muted-2);font-size:9px;text-align:center}
.toast{position:fixed;right:50%;bottom:24px;z-index:5;padding:10px 15px;border:1px solid #514961;border-radius:8px;transform:translate(50%,10px);background:#302b43;color:var(--text);font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.visible{transform:translate(50%,0);opacity:1}
[hidden]{display:none!important}
@media(max-width:520px){.app-shell{padding:23px 25px 17px}.timer-stage{width:min(100%,300px);margin-top:19px}.task-input-wrap,.duration-control,.action-row{width:100%}.tab{padding-bottom:12px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

</style>

<script>
function formatTime(totalSeconds) {
  const value = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  const minutes = Math.floor(value / 60);
  const seconds = value % 60;
  return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function remainingSeconds(_durationMs, endAtMs, nowMs = Date.now()) {
  if (!Number.isFinite(endAtMs) || !Number.isFinite(nowMs)) return 0;
  return Math.max(0, Math.ceil((endAtMs - nowMs) / 1000));
}

function normalizeMinutes(value) {
  const text = String(value ?? '').trim();
  if (!/^\d+$/.test(text)) return null;
  const minutes = Number(text);
  return Number.isSafeInteger(minutes) && minutes >= 1 && minutes <= 180 ? minutes : null;
}

const api = { formatTime, remainingSeconds, normalizeMinutes };
if (typeof module !== 'undefined' && module.exports) module.exports = api;
if (typeof window !== 'undefined') window.PomodoroCore = api;

</script>

}

  return `${formatMinutes(minutes, language)} ${language === 'ru' ? 'сегодня' : 'today'}`;
}

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=', document.baseURI).href);
  completionAudio.preload = 'auto';
  const els = {
    date: $('dateLabel'), task: $('taskInput'), taskCaption: $('taskCaption'), time: $('timeDisplay'),
    ring: $('ringProgress'), stage: document.querySelector('.timer-stage'), statusDot: $('statusDot'),
    status: $('statusLabel'), start: $('startButton'), startLabel: $('startLabel'), reset: $('resetButton'),
    custom: $('customMinutes'), trackTab: $('trackTab'), sessionsTab: $('sessionsTab'),
    trackView: $('trackView'), sessionsView: $('sessionsView'), sessionCount: $('sessionCount'),
    sessionList: $('sessionList'), todayTotal: $('todayTotal'), toast: $('toast'),
    langEn: $('langEn'), langRu: $('langRu'), brand: document.querySelector('.brand'), mainNav: $('mainNav')
  };

  function readState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch { return {}; }
  }
  const saved = readState();
  let language = saved.language === 'ru' ? 'ru' : 'en';
  const t = (key) => i18n.getText(language, key);
  let duration = Number.isInteger(saved.duration) && saved.duration >= 60 && saved.duration <= 10800 ? saved.duration : DEFAULT_SECONDS;
  let remaining = Number.isFinite(saved.remaining) && saved.remaining >= 0 ? Math.floor(saved.remaining) : duration;
  let task = typeof saved.task === 'string' ? saved.task.slice(0, 64) : '';
  let sessions = Array.isArray(saved.sessions) ? saved.sessions.filter(isValidSession).slice(0, 100) : [];
  let running = Boolean(saved.running && Number.isFinite(saved.endAt));
  let endAt = running ? saved.endAt : 0;
  if (running) {
    remaining = core.remainingSeconds(duration * 1000, endAt);
    if (remaining === 0) completeSession();
  }

  function isValidSession(item) {
    return item && typeof item === 'object' && typeof item.task === 'string' && Number.isFinite(item.minutes) && typeof item.at === 'string';
  }
  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ duration, remaining, task, language, running, endAt, sessions })); }
    catch { showToast(t('toastStorage')); }
  }
  function setStatus(text, kind = '') {
    els.status.textContent = text;
    els.statusDot.className = `status-dot${kind ? ` ${kind}` : ''}`;
  }
  function applyLanguage() {
    const locale = i18n.getDateLocale(language);
    document.documentElement.lang = language;
    els.brand.setAttribute('aria-label', t('appAria'));
    els.mainNav.setAttribute('aria-label', t('navAria'));
    els.trackView.setAttribute('aria-label', t('timerAria'));
    els.langEn.setAttribute('aria-label', t('languageEnglish'));
    els.langRu.setAttribute('aria-label', t('languageRussian'));
    els.langEn.classList.toggle('active', language === 'en');
    els.langRu.classList.toggle('active', language === 'ru');
    els.langEn.setAttribute('aria-pressed', String(language === 'en'));
    els.langRu.setAttribute('aria-pressed', String(language === 'ru'));
    els.trackTab.textContent = t('navTrack');
    $('sessionsLabel').textContent = t('navSessions');
    document.querySelector('.language-switch').setAttribute('aria-label', t('languageGroup'));
    document.querySelector('.task-input-wrap label').textContent = t('taskLabel');
    els.task.placeholder = t('taskPlaceholder');
    document.querySelector('.control-label').textContent = t('duration');
    document.querySelector('.duration-options').setAttribute('aria-label', t('durationGroup'));
    els.custom.setAttribute('aria-label', t('customMinutes'));
    document.querySelector('.custom-duration span').textContent = t('minSuffix');
    els.reset.setAttribute('aria-label', t('reset'));
    els.reset.title = t('reset');
    $('sessionsHeading').textContent = t('sessionsTitle');
    document.querySelector('.view-eyebrow').textContent = t('sessionsEyebrow');
    document.querySelector('.privacy-note').textContent = t('privacy');
    const footer = document.querySelector('.app-footer');
    footer.children[0].textContent = t('footerLeft');
    footer.children[2].textContent = t('footerRight');
    els.date.textContent = new Intl.DateTimeFormat(locale, { weekday: 'short', day: 'numeric', month: 'short' }).format(new Date()).replace('.', '').toUpperCase();
  }
  function render() {
    applyLanguage();
    els.time.textContent = core.formatTime(remaining);
    document.title = `${core.formatTime(remaining)} — ${t('appTitle')}`;
    els.task.value = task;
    els.taskCaption.textContent = task.trim() || (remaining === 0 ? t('taskComplete') : t('taskEmpty'));
    els.taskCaption.title = task;
    const progress = duration ? Math.max(0, Math.min(1, remaining / duration)) : 1;
    els.ring.style.strokeDasharray = `${CIRCUMFERENCE}`;
    els.ring.style.strokeDashoffset = `${CIRCUMFERENCE * (1 - progress)}`;
    els.stage.classList.toggle('is-running', running);
    els.stage.classList.toggle('is-complete', !running && remaining === 0);
    els.startLabel.textContent = running ? t('pause') : (remaining === duration || remaining === 0 ? t('start') : t('resume'));
    els.start.querySelector('.button-icon').textContent = running ? 'Ⅱ' : '▶';
    els.task.disabled = running;
    document.querySelectorAll('.duration-chip').forEach((button) => {
      const selected = Number(button.dataset.minutes) * 60 === duration;
      button.classList.toggle('selected', selected);
      button.setAttribute('aria-pressed', String(selected));
      button.disabled = running;
    });
    els.custom.disabled = running;
    setStatus(running ? t('statusRunning') : remaining === 0 ? t('statusComplete') : t('statusOff'), running ? 'running' : remaining === 0 ? 'complete' : '');
    const today = new Date().toDateString();
    const todaySessions = sessions.filter((session) => new Date(session.at).toDateString() === today);
    els.sessionCount.textContent = String(sessions.length);
    els.todayTotal.textContent = i18n.formatTodayTotal(todaySessions.reduce((sum, session) => sum + session.minutes, 0), language);
    renderSessions();
  }
  function renderSessions() {
    els.sessionList.replaceChildren();
    if (!sessions.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = t('emptySessions');
      els.sessionList.append(empty);
      return;
    }
    sessions.forEach((session) => {
      const card = document.createElement('article');
      card.className = 'session-card';
      const main = document.createElement('div');
      main.className = 'session-main';
      const name = document.createElement('div');
      name.className = 'session-name';
      name.textContent = session.task || t('sessionFallback');
      const meta = document.createElement('div');
      meta.className = 'session-meta';
      meta.textContent = new Date(session.at).toLocaleString(i18n.getDateLocale(language), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      const durationLabel = document.createElement('div');
      durationLabel.className = 'session-duration';
      durationLabel.textContent = i18n.formatMinutes(session.minutes, language);
      main.append(name, meta);
      card.append(main, durationLabel);
      els.sessionList.append(card);
    });
  }
  function showToast(text) {
    els.toast.textContent = text;
    els.toast.classList.add('visible');
    clearTimeout(showToast.timeout);
    showToast.timeout = setTimeout(() => els.toast.classList.remove('visible'), 2300);
  }
  function setDuration(minutes) {
    if (running) return;
    duration = minutes * 60;
    remaining = duration;
    endAt = 0;
    persist();
    render();
  }
  function playChime() {
    try {
      completionAudio.pause();
      completionAudio.currentTime = 0;
      const playback = completionAudio.play();
      if (playback && typeof playback.catch === 'function') playback.catch(() => {});
    } catch { /* Sound is optional; timer state still completes. */ }
  }
  function completeSession() {
    if (!running && remaining === 0) return;
    running = false;
    remaining = 0;
    endAt = 0;
    sessions.unshift({ task: task.trim(), minutes: Math.round(duration / 60), at: new Date().toISOString() });
    sessions = sessions.slice(0, 100);
    persist();
    render();
    playChime();
    showToast(t('toastComplete'));
  }
  function refreshClock() {
    if (!running) return;
    const next = core.remainingSeconds(duration * 1000, endAt);
    if (next === 0) { completeSession(); return; }
    if (next !== remaining) {
      remaining = next;
      persist();
      render();
    }
  }
  function toggleTimer() {
    if (running) {
      refreshClock();
      if (!running) return;
      running = false;
      remaining = core.remainingSeconds(duration * 1000, endAt);
      endAt = 0;
    } else {
      if (remaining === 0) remaining = duration;
      running = true;
      endAt = Date.now() + remaining * 1000;
    }
    persist();
    render();
  }
  function resetTimer() {
    running = false;
    endAt = 0;
    remaining = duration;
    persist();
    render();
  }
  function showView(view) {
    const sessionsActive = view === 'sessions';
    els.trackView.hidden = sessionsActive;
    els.sessionsView.hidden = !sessionsActive;
    els.trackTab.classList.toggle('active', !sessionsActive);
    els.sessionsTab.classList.toggle('active', sessionsActive);
    els.trackTab.toggleAttribute('aria-current', !sessionsActive);
    els.sessionsTab.toggleAttribute('aria-current', sessionsActive);
  }

  function setLanguage(nextLanguage) {
    if (nextLanguage !== 'en' && nextLanguage !== 'ru') return;
    language = nextLanguage;
    persist();
    render();
  }
  els.start.addEventListener('click', toggleTimer);
  els.reset.addEventListener('click', resetTimer);
  els.langEn.addEventListener('click', () => setLanguage('en'));
  els.langRu.addEventListener('click', () => setLanguage('ru'));
  els.task.addEventListener('input', () => { task = els.task.value.slice(0, 64); els.taskCaption.textContent = task.trim() || t('taskEmpty'); persist(); });
  document.querySelectorAll('.duration-chip').forEach((button) => button.addEventListener('click', () => setDuration(Number(button.dataset.minutes))));
  els.custom.addEventListener('change', () => {
    const minutes = core.normalizeMinutes(els.custom.value);
    if (minutes === null) { els.custom.value = ''; showToast(t('toastInvalid')); return; }
    setDuration(minutes);
    els.custom.value = '';
  });
  els.trackTab.addEventListener('click', () => showView('track'));
  els.sessionsTab.addEventListener('click', () => showView('sessions'));
  window.addEventListener('keydown', (event) => {
    const tag = document.activeElement?.tagName;
    if ((event.code === 'Space' || event.code === 'Enter') && !['INPUT', 'TEXTAREA', 'BUTTON'].includes(tag)) {
      if (event.code === 'Space') { event.preventDefault(); toggleTimer(); }
    }
  });
  render();
  persist();
  window.setInterval(refreshClock, 200);
})();
